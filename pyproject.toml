[build-system]
requires = ["setuptools >= 77, <= 80.10.2"]  # >= 77 for the SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "MJOLNIR"
dynamic = ["version"]
description = "Neutron Scattering software suite"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jakob Lass", email = "MJOLNIRPackage@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib>=3",
    "numpy>=2.3",
    "h5py>=2.5",
    "scipy",
    "pandas",
    "sympy",
    "ufit>=1.4.0",
    "regex",
]

[project.optional-dependencies]
# torch comes with AMBER-ds4ms; it is named here so that uv takes it from the CPU index below
AMBER = ["AMBER-ds4ms", "torch"]
gui = ["MJOLNIRGui"]

[dependency-groups]
# Development only, not installed with the package; uv sync installs the dev group by default
dev = [
    "pytest>=8",
    "pytest-cov",
]

[project.scripts]
MJOLNIRHistory = "MJOLNIR.CommandLineScripts.MJOLNIRHistory:main"
MJOLNIRCalibrationInspector = "MJOLNIR.CommandLineScripts.MJOLNIRCalibrationInspector:main"
MJOLNIR3DView = "MJOLNIR.CommandLineScripts.MJOLNIR3DView:main"

[project.urls]
Homepage = "https://github.com/MJOLNIRPackage/MJOLNIR"

[tool.setuptools.dynamic]
version = { attr = "MJOLNIR.__version__" }
# Package discovery and package data stay in setup.cfg

# CPU-only torch for uv environments (the default PyPI build pulls in several GB of CUDA
# libraries). Applies to uv sync/lock only; pip users of the package get torch from PyPI
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true # Only packages that name this index in tool.uv.sources come from it

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"  # matches python_requires in setup.cfg
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes: unused imports/variables, undefined names
    "E4",    # import placement
    "E7",    # statement-level issues (bare except, == True, ...)
    "E9",    # syntax / IO errors
    "W605",  # invalid escape sequences
    "B",     # flake8-bugbear: likely bugs
    "UP",    # pyupgrade: outdated syntax
    "T10",   # debugger calls left in code
]
ignore = [
    # Style choices that don't fit this codebase
    "E741",  # ambiguous names like l, I: common in physics code
    "E731",  # lambda assignment
    "E701",  # one-line if/for bodies

    # Existing debt: remove an entry once its violations are fixed
    "E712",  # == True/False: autofix is unsafe on numpy arrays, fix by hand
    "E722",  # bare except
    "F405",  # names from star imports (test/test_tools.py)
    "F403",  # star imports
    "F841",  # unused local variables
    "B011",  # assert False in tests, should use pytest.fail / pytest.raises
    "B023",  # closures capturing loop variables
    "B028",  # warnings.warn without stacklevel
    "B904",  # raise without from inside except
    "B905",  # zip() without strict=
    "UP031", # %-formatting
    "B008",  # function call (np.array) in argument default
    "B017",  # pytest.raises(Exception)
    "B020",  # loop variable shadows the iterable (Data/DataSet.py)
    "B027",  # empty method in abstract base class without @abstractmethod
]

[tool.ruff.lint.per-file-ignores]
# Command-line tools configure matplotlib/Qt before importing MJOLNIR
"MJOLNIR/CommandLineScripts/*" = ["E402"]
