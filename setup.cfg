# Which packages and data files the wheel contains. Everything else (metadata, dependencies,
# extras, entry points) is in pyproject.toml.

[options]
packages = find:

[options.packages.find]
include = MJOLNIR*

[options.package_data]
# Calibration tables, read at run time (MJOLNIR/__init__.py)
MJOLNIR = *.calib, *.csv
