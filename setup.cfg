# Project metadata, dependencies, extras and entry points are in pyproject.toml ([project]).
# This file keeps the setuptools-specific build options only.

[options]
packages = find:
include_package_data = True
zip_safe = False

[options.package_data]
* = *.calib, *.csv
license = license.txt
CommandLineScripts/.settings = CommandLineScripts/.settings
Geometry/detsequence.dat = Geometry/detsequence.dat


[bdist_wheel]
# This flag says to generate wheels that support both Python 2 and Python
# 3. If your code will not run unchanged on both Python 2 and 3, you will
# need to generate separate wheels for each Python version that you
# support.
universal=0
